name: Build Documentation

on:
  workflow_dispatch:

jobs:
  pandoc:
    runs-on: ubuntu-latest
    steps:
      - name: Install pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e ##v1.1.1

      - name: Run pandoc
        run: pandoc --version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 ##v7.0.1
        
      - name: Build documentation
        working-directory: docs
        run: |
          pandoc manual/manual.tex \
            --standalone \
            --to=gfm \
            --lua-filter=build/mkdocs.lua \
            --output=manual/manual.md

      - name: Split manual into sections
        working-directory: docs
        run: python3 build/split_manual.py

      - name: upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 ##v7.0.2
        with:
          path: |
            docs/manual/manual.md
            docs/manual/ug_*.md
            docs/manual/images/
      
     