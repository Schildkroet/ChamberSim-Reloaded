name: Prepare manual folder

on:
  workflow_call:
    outputs:
      artifact_id: 
        description: "artifact id"
        value:  ${{ jobs.prep-folder.outputs.artifact_id }}
      version:
        description: "CSR version from CMakeLists.txt"
        value: ${{ jobs.prep-folder.outputs.version }}

permissions:
  contents: read

jobs:
  prep-folder:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id}}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            CMakeLists.txt
            docs/manual
            docs/build
            packaging/linux/chambersimreloaded.svg

      - name: Read CSR version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^set(CSR_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)"
          if [ -z "$version" ]; then
            echo "CSR_VERSION was not found in CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: prepare folders for mkdocs
        shell: bash
        working-directory: docs
        run: |
          mkdir -p build/docs
          mv manual/*.md build/docs/
          mv *.md build/docs/
          mv manual/images build/docs/
          mv build/javascripts build/docs/
          cp -r build/resources build/docs/

      - run: cp packaging/linux/chambersimreloaded.svg docs/build/docs/images/favicon.svg

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Convert GFM alerts for MkDocs
        run: python docs/build/gfm_to_mkdocs.py docs/build/docs

      - name: upload folder
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 ##v7.0.2
        with:
          name: folder
          path: docs/build
          retention-days: 1
          overwrite: true
