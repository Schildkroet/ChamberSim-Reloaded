name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.5.3"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # the .deb files are cached (key: package list), a later run restores them instead of downloading and installing
      - name: System packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfontconfig1 libfreetype6 libdbus-1-3
          version: ubuntu-24.04-v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtcharts
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target tst_core tst_gui csr_datacheck csr_sim --parallel

      # tst_core, tst_gui (offscreen, see tests/CMakeLists.txt) and the check of the project database (data/)
      - name: Run the tests
        run: ctest --test-dir build --output-on-failure

  linux:
    name: Linux AppImage
    needs: [manual]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      # the .deb files are cached (key: package list), a later run restores them instead of downloading and installing
      - name: System packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfontconfig1 libfreetype6 libdbus-1-3
          version: ubuntu-24.04-v1

      # the manual built by the manual job replaces the tracked PDF that cmake --install packages
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.manual.outputs.pdf_artifact_id }}
          path: manual-dl
          merge-multiple: true
          skip-decompress: true
      - name: Use the freshly built manual
        shell: bash
        run: cp manual-dl/ChamberSimReloaded-UserManual.pdf docs/manual/manual.pdf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtcharts
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target ChamberSimReloaded csr_fitpowder csr_sim --parallel

      - name: Smoke test (starts the app offscreen and takes a screenshot)
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/ChamberSimReloaded --screenshot "$RUNNER_TEMP/smoke.png" && test -s "$RUNNER_TEMP/smoke.png"

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"     # no FUSE on the runner
          NO_STRIP: "1"
        run: |
          # named after the program version (set(CSR_VERSION ...) in CMakeLists.txt)
          version=$(sed -n 's/^set(CSR_VERSION "\(.*\)")/\1/p' CMakeLists.txt)
          export LDAI_OUTPUT="ChamberSimReloaded-${version}-x86_64.AppImage"
          # only the SQLite driver is needed; the others would pull in client libraries that are not installed
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name '*.so' ! -name 'libqsqlite.so' -delete
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appdir AppDir --plugin qt \
            --desktop-file packaging/linux/chambersimreloaded.desktop \
            --icon-file packaging/linux/chambersimreloaded.svg \
            --output appimage
          ls -l *.AppImage

      # the AppImage as it is (not wrapped in a zip)
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          path: "*.AppImage"
          archive: false
          if-no-files-found: error

  windows:
    name: Windows
    needs: [manual]
    runs-on: windows-2022
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      # the manual built by the manual job replaces the tracked PDF that cmake --install packages
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.manual.outputs.pdf_artifact_id }}
          path: manual-dl
          merge-multiple: true
          skip-decompress: true
      - name: Use the freshly built manual
        shell: bash
        run: cp manual-dl/ChamberSimReloaded-UserManual.pdf docs/manual/manual.pdf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts
          cache: true

      # the MSVC build environment (what ilammy/msvc-dev-cmd does, which still runs on Node.js 20): run vcvars64 and
      # hand the variables it changes to the following steps
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the C++ tools not found" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ChamberSimReloaded csr_fitpowder csr_sim --parallel

      - name: Collect and deploy Qt
        shell: pwsh
        run: |
          cmake --install build --prefix dist
          if ($LASTEXITCODE -ne 0) { throw "cmake --install failed" }
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw dist\bin\ChamberSimReloaded.exe
          # windeployqt --compiler-runtime only adds the vc_redist installer; copy the runtime DLLs themselves (app-local)
          $crt = Get-ChildItem "$env:VCINSTALLDIR\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "Visual C++ runtime directory not found" }
          Copy-Item "$($crt.FullName)\*.dll" dist\bin
          Get-ChildItem dist\bin

      - name: Smoke test (starts the app and takes a screenshot)
        shell: pwsh
        run: |
          # a GUI program: start-process waits until it has exited
          $p = Start-Process -FilePath dist\bin\ChamberSimReloaded.exe -ArgumentList '--screenshot', "$env:RUNNER_TEMP\smoke.png" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (-not (Test-Path "$env:RUNNER_TEMP\smoke.png")) { throw "no screenshot written" }

      - name: Zip
        shell: pwsh
        run: |
          # named after the program version (set(CSR_VERSION ...) in CMakeLists.txt)
          $version = (Select-String -Path CMakeLists.txt -Pattern '^set\(CSR_VERSION "(.*)"\)').Matches[0].Groups[1].Value
          $name = "ChamberSimReloaded-$version-windows-x64"
          Move-Item dist\bin $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      # upload the zip as it is: zipped again by upload-artifact, the download would be a zip inside a zip
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          path: "*.zip"
          archive: false
          if-no-files-found: error

  prep-folder:
    uses: ./.github/workflows/prepare-manual-folder.yml
  
  manual:
    needs: prep-folder
    uses: ./.github/workflows/build-manual-pdf.yml
    with:
      artifact_id: ${{ needs.prep-folder.outputs.artifact_id}}
      version: ${{ needs.prep-folder.outputs.version }}

  release:
    name: Release (tags only)
    needs: [tests, linux, windows, manual]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.linux.outputs.artifact_id }}, ${{ needs.windows.outputs.artifact_id}}, ${{ needs.manual.outputs.pdf_artifact_id}}
          path: artifacts
          merge-multiple: true
          skip-decompress: true     # the Windows zip stays a zip (it would be unpacked into a folder, which the upload skips)
      
      - name: show files
        run: ls -alR

      - uses: softprops/action-gh-release@v3
        with:
          name: ChamberSim Reloaded ${{ github.ref_name }}
          draft: true
          files: artifacts/*
