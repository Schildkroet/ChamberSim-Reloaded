# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      -main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            docs/manual
      - name: lint md
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff #v24.2.0
        with:
          globs: 'docs/manual/ug_*.md'
        continue-on-error: true
  
  prep-folder:
    needs: lint
    uses: ./.github/workflows/prepare-manual-folder.yml
  
  build-pdf:
    needs: prep-folder
    uses: ./.github/workflows/build-manual-pdf.yml
    with:
      artifact_id: ${{ needs.prep-folder.outputs.artifact_id}}
        
  build-site:
    needs: prep-folder
    uses: ./.github/workflows/build-manual-site.yml
    with:
      artifact_id: ${{ needs.prep-folder.outputs.artifact_id}}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
    needs: [build-pdf,build-site]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: get artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 ##v8.0.2
        with:
          artifact-ids: ${{ needs.build-pdf.outputs.pdf_artifact_id}}, ${{needs.build-site.outputs.site_artifact_id }}
          path: site
          merge-multiple: true
          
      - name: show files
        run: ls -alR 

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1
